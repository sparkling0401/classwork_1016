<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常拾光｜每日生活清單</title>
<style>
:root{--paper:#fbfaf6;--canvas:#f1efe8;--ink:#34372f;--muted:#929187;--line:#eae7df;--olive:#748166;--olive-pale:#edf0e8;--coral:#d49378;--serif:Georgia,"Noto Serif TC","Songti TC",serif;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink)}button,input{font:inherit}button{color:inherit}.page{max-width:1120px;margin:auto;padding:31px 50px 46px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;letter-spacing:.11em}.brand-mark{display:grid;width:31px;height:31px;place-items:center;border:1px solid #d8d7cd;border-radius:50%;color:var(--olive);font-size:16px}.top-note{color:var(--muted);font-size:12px;letter-spacing:.1em}.hero{position:relative;overflow:hidden;display:flex;min-height:190px;align-items:center;justify-content:space-between;padding:33px 47px;border:1px solid #eae7df;border-radius:5px;background:var(--paper)}.hero:after{position:absolute;right:56px;bottom:-89px;width:210px;height:210px;border:1px solid #e7e8de;border-radius:50%;content:""}.hero:before{position:absolute;right:91px;bottom:-55px;width:142px;height:142px;border:1px solid #eeece5;border-radius:50%;content:""}.eyebrow{margin-bottom:10px;color:var(--olive);font-size:11px;letter-spacing:.22em}h1{margin:0;font-family:var(--serif);font-size:clamp(30px,4vw,43px);font-weight:400;letter-spacing:.09em}.hero-caption{margin:11px 0 0;color:var(--muted);font-size:13px;letter-spacing:.06em}.date-display{position:relative;z-index:1;min-width:130px;padding-left:27px;border-left:1px solid var(--line);text-align:right}.date-day{color:var(--olive);font-family:var(--serif);font-size:39px;line-height:1}.date-month{margin-top:9px;color:var(--muted);font-size:12px;letter-spacing:.12em}.layout{display:grid;grid-template-columns:.91fr 1.09fr;gap:20px;margin-top:20px}.card{padding:25px 27px 21px;border:1px solid #eae7df;border-radius:5px;background:var(--paper)}.card-heading{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.heading-main{display:flex;gap:12px;align-items:center}.heading-icon{display:grid;width:35px;height:35px;place-items:center;border-radius:50%;background:var(--olive-pale);color:var(--olive);font-size:15px}.card h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.08em}.card-subtitle{margin:4px 0 0;color:var(--muted);font-size:11px;letter-spacing:.05em}.count{padding:5px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:10px;letter-spacing:.08em}.habit-row{display:grid;grid-template-columns:28px 1fr 18px;align-items:center;min-height:52px;border-top:1px solid var(--line)}.number{color:#aaa89d;font-family:var(--serif);font-size:13px}.habit-input,.todo-input{width:100%;min-width:0;padding:9px 0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}.habit-input::placeholder,.todo-input::placeholder{color:#b9b6ab}.habit-input:focus,.todo-input:focus{box-shadow:0 1px 0 var(--olive)}.habit-spark{color:#b1b49f;font-size:13px;text-align:right}.todo-row{display:grid;grid-template-columns:29px 1fr 78px;align-items:center;gap:7px;min-height:52px;border-top:1px solid var(--line)}.task-check{display:grid;width:19px;height:19px;place-items:center;padding:0;border:1px solid #cfcec4;border-radius:50%;background:transparent;color:white;cursor:pointer;font-size:11px}.todo-row.is-done .task-check{border-color:var(--olive);background:var(--olive)}.todo-row.is-done .todo-input{color:#a6a398;text-decoration:line-through}.status{justify-self:end;padding:5px 8px;border:1px solid #e9e5dc;border-radius:3px;background:#f8f6f1;color:#979286;cursor:pointer;font-size:10px}.status[data-state="進行中"]{border-color:#eadbce;background:#f8f0e9;color:#b47c5f}.status[data-state="已完成"]{border-color:#dfe5d8;background:#eef1e9;color:#718066}.bottom-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;margin-top:20px}.gentle-note{display:flex;align-items:center;gap:11px;padding:14px 18px;border:1px solid #e8e6dd;background:#f7f5ef;color:#858376;font-family:var(--serif);font-size:13px}.gentle-note span{color:var(--coral)}.actions{display:flex;gap:9px}.action-button{min-height:42px;padding:0 17px;border:1px solid #dfe1d8;border-radius:3px;background:transparent;color:#707568;cursor:pointer;font-size:12px;letter-spacing:.08em}.action-button:hover{background:#edf0e8}.action-button.primary{border-color:var(--olive);background:var(--olive);color:white}.toast{position:fixed;right:25px;bottom:25px;padding:11px 17px;border-radius:3px;background:#484d40;color:white;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.footer{margin-top:19px;color:#a39f94;font-size:10px;letter-spacing:.13em;text-align:center}
@media(max-width:700px){.page{padding:23px 18px 32px}.topbar{margin-bottom:23px}.top-note{font-size:10px}.hero{min-height:163px;padding:27px 24px}.hero:after{right:-56px}.hero:before{right:-20px}.hero-caption{max-width:205px;line-height:1.7}.date-display{min-width:78px;padding-left:17px}.date-day{font-size:34px}.date-month{font-size:10px}.layout{grid-template-columns:1fr;gap:14px;margin-top:14px}.card{padding:22px 21px 17px}.bottom-row{grid-template-columns:1fr}.actions{justify-content:flex-end}}@media(max-width:390px){.hero{padding-right:16px;padding-left:18px}.hero-caption{max-width:175px;font-size:12px}.date-display{min-width:67px;padding-left:11px}.date-day{font-size:31px}.action-button{padding:0 13px}}
</style></head><body><main class="page"><header class="topbar"><div class="brand"><span class="brand-mark">✳</span>日常拾光</div><div class="top-note">把日子，過成喜歡的樣子</div></header>

<section class="hero" aria-labelledby="page-title"><div><div class="eyebrow">A LITTLE NOTE FOR TODAY</div><h1 id="page-title">今天，慢慢來</h1><p class="hero-caption">在平凡日子裡，記下想完成的小事。</p></div><div class="date-display"><div class="date-day" id="date-day"></div><div class="date-month" id="date-month"></div></div></section>
<section class="layout" aria-label="每日生活表單"><article class="card"><div class="card-heading"><div class="heading-main"><span class="heading-icon">☼</span><div><h2>每日固定事項</h2><p class="card-subtitle">給日常一點溫柔的節奏</p></div></div><span class="count">01 — 03</span></div><div class="habit-list">
<label class="habit-row"><span class="number">01</span><input class="habit-input" data-habit="0" aria-label="每日固定事項一" placeholder="例如：早晨喝一杯溫水"><span class="habit-spark">✳</span></label>
<label class="habit-row"><span class="number">02</span><input class="habit-input" data-habit="1" aria-label="每日固定事項二" placeholder="例如：閱讀 15 分鐘"><span class="habit-spark">✳</span></label>
<label class="habit-row"><span class="number">03</span><input class="habit-input" data-habit="2" aria-label="每日固定事項三" placeholder="例如：睡前伸展一下"><span class="habit-spark">✳</span></label></div></article>
<article class="card"><div class="card-heading"><div class="heading-main"><span class="heading-icon">♡</span><div><h2>今日想完成</h2><p class="card-subtitle">不必很多，三件剛剛好</p></div></div><span class="count" id="progress-count">0 / 3 完成</span></div><div class="todo-list">
<div class="todo-row"><button class="task-check" aria-label="標記事項一完成" aria-pressed="false"></button><input class="todo-input" aria-label="今日代辦事項一" placeholder="寫下一件想完成的事"><button class="status" data-state="待開始">待開始</button></div>
<div class="todo-row"><button class="task-check" aria-label="標記事項二完成" aria-pressed="false"></button><input class="todo-input" aria-label="今日代辦事項二" placeholder="寫下一件想完成的事"><button class="status" data-state="待開始">待開始</button></div>
<div class="todo-row"><button class="task-check" aria-label="標記事項三完成" aria-pressed="false"></button><input class="todo-input" aria-label="今日代辦事項三" placeholder="寫下一件想完成的事"><button class="status" data-state="待開始">待開始</button></div></div></article></section>
<div class="bottom-row"><div class="gentle-note"><span>✿</span>完成一點點，也值得好好肯定自己。</div><div class="actions"><button class="action-button" id="reset-button">重新整理</button><button class="action-button primary" id="save-button">收藏今天　↗</button></div></div><footer class="footer">A SOFTER WAY TO SPEND YOUR DAY　·　留一點空白給自己</footer></main><div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const now=new Date(),day=new Intl.DateTimeFormat('zh-TW',{day:'2-digit'}).format(now),month=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',weekday:'long'}).format(now);
document.querySelector('#date-day').textContent=day;document.querySelector('#date-month').textContent=month;
const dateKey=now.toLocaleDateString('en-CA'),dailyKey='daily-note-'+dateKey,habitKey='daily-note-habits',states=['待開始','進行中','已完成'],toast=document.querySelector('#toast');let timer;
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2100)}
function progress(){const count=[...document.querySelectorAll('.todo-row')].filter(row=>row.classList.contains('is-done')).length;document.querySelector('#progress-count').textContent=`${count} / 3 完成`}
function mark(row,done){const check=row.querySelector('.task-check'),status=row.querySelector('.status');row.classList.toggle('is-done',done);check.textContent=done?'✓':'';check.setAttribute('aria-pressed',String(done));status.dataset.state=done?'已完成':'待開始';status.textContent=status.dataset.state;progress()}
function save(){localStorage.setItem(dailyKey,JSON.stringify([...document.querySelectorAll('.todo-row')].map(row=>({text:row.querySelector('.todo-input').value,state:row.querySelector('.status').dataset.state}))))}
try{
const habits=JSON.parse(localStorage.getItem(habitKey)||'[]');document.querySelectorAll('.habit-input').forEach((input,i)=>{input.value=habits[i]||'';input.addEventListener('input',()=>localStorage.setItem(habitKey,JSON.stringify([...document.querySelectorAll('.habit-input')].map(field=>field.value))))});
const saved=JSON.parse(localStorage.getItem(dailyKey)||'null');if(saved?.length){}if(saved?.todos)document.querySelectorAll('.todo-row').forEach((row,i)=>{const task=saved.todos[i];if(!task)return;row.querySelector('.todo-input').value=task.text||'';const status=row.querySelector('.status');status.dataset.state=states.includes(task.state)?task.state:'待開始';status.textContent=status.dataset.state;if(status.dataset.state==='已完成'){row.classList.add('is-done');row.querySelector('.task-check').textContent='✓';row.querySelector('.task-check').setAttribute('aria-pressed','true')}})
}catch(error){console.warn('本機儲存空間無法使用。',error)}
document.querySelectorAll('.todo-input').forEach(input=>input.addEventListener('input',save));document.querySelectorAll('.task-check').forEach(button=>button.addEventListener('click',()=>{const row=button.closest('.todo-row');mark(row,!row.classList.contains('is-done'));save()}));
document.querySelectorAll('.status').forEach(button=>button.addEventListener('click',()=>{const row=button.closest('.todo-row'),state=states[(states.indexOf(button.dataset.state)+1)%3];button.dataset.state=state;button.textContent=state;row.classList.toggle('is-done',state==='已完成');const check=row.querySelector('.task-check');check.textContent=state==='已完成'?'✓':'';check.setAttribute('aria-pressed',String(state==='已完成'));progress();save()}));
document.querySelector('#save-button').addEventListener('click',()=>{try{save();notify('今天的清單已為你收藏 ✿')}catch(error){notify('無法儲存，請檢查瀏覽器設定。')}});
document.querySelector('#reset-button').addEventListener('click',()=>{document.querySelectorAll('.todo-row').forEach(row=>{row.querySelector('.todo-input').value='';mark(row,false)});try{localStorage.removeItem(dailyKey)}catch(error){}notify('今日代辦已清空，重新開始吧。')});progress()
})();
</script></body></html>
